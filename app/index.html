<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Studio · Arts to Hearts</title>
  <meta name="description" content="Write your artist bio and statement, file every version and reopen it later.">
  <meta name="theme-color" content="#FBF6EF">
  <link rel="stylesheet" href="assets/fonts.css">
  <link rel="stylesheet" href="css/studio.css">
</head>
<body>
  <a class="skip" href="#main">Skip to the studio</a>
  <header class="top">
    <a class="brand" href="#/" aria-label="My Studio home"><b>Arts to Hearts</b><span>My Studio</span></a>
    <nav class="nav" aria-label="Studio sections">
      <a href="#/bio" data-route="bio" data-sec="bio"><i></i>Bio</a>
      <a href="#/statement" data-route="statement" data-sec="statement"><i></i>Statement</a>
      <a href="#/files" data-route="files" data-sec="files"><i></i>My files</a>
    </nav>
    <div class="pop">
      <button type="button" class="icon-btn" id="settings-btn" aria-expanded="false" aria-controls="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <div class="pop-panel" id="settings" hidden>
        <p class="pop-k">Appearance</p>
        <div class="seg" role="group" aria-label="Appearance">
          <button type="button" data-theme-set="light" aria-pressed="true">Light</button>
          <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
        </div>
        <label class="switch"><input type="checkbox" id="motion-on" checked> <span>Motion and 3D movement</span></label>
        <label class="switch"><input type="checkbox" id="sound-on"> <span>Paper sounds</span></label>
        <label class="vol"><span>Volume</span><input type="range" id="sound-vol" min="0" max="100" value="60" aria-label="Sound volume"></label>
        <button type="button" class="btn btn-quiet small" id="sound-test">Play a sound</button>
        <p class="fine">Sounds are placeholders. Logo and final typefaces are pending.</p>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <dialog class="doc-dialog" id="doc-dialog" aria-labelledby="doc-title"></dialog>

  <script src="vendor/three.min.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/service.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/scene3d.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
