<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Studio · Arts to Hearts</title>
  <meta name="description" content="Write your artist bio and statement, file every version and reopen it later.">
  <meta name="theme-color" content="#F9ECE5">
  <link rel="stylesheet" href="assets/fonts.css">
  <link rel="stylesheet" href="css/studio.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter><filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="6"/></filter></svg>
  <div id="glow" aria-hidden="true"></div>
  <div id="torch" aria-hidden="true"></div>
  <div id="cursor" aria-hidden="true"><span></span></div>
  <a class="skip" href="#main">Skip to the studio</a>
  <header class="top">
    <a class="brand" href="#/" aria-label="My Studio home">
      <span class="brand-word">Arts to Hearts</span><span class="brand-rule" aria-hidden="true"></span><span class="brand-sub">My Studio</span>
    </a>
    <nav class="index" aria-label="Studio sections">
      <a href="#/" data-route="home" class="ix ix-studio">Studio</a>
      <a href="#/bio" data-route="bio" class="ix ix-bio">Bio</a>
      <a href="#/statement" data-route="statement" class="ix ix-statement">Statement</a>
      <a href="#/files" data-route="files" class="ix ix-files">My files</a>
    </nav>
    <div class="controls">
      <div class="pop">
        <button type="button" class="pill" id="desk-btn" aria-expanded="false" aria-controls="desk-panel">Desk <span class="mono" id="desk-state">Paper</span></button>
        <div class="pop-panel" id="desk-panel" hidden>
          <div class="seg" role="group" aria-label="Desk">
            <button type="button" data-theme-set="light" aria-pressed="true">Paper</button>
            <button type="button" data-theme-set="dark" aria-pressed="false">Ink</button>
          </div>
          <label class="switch"><input type="checkbox" id="motion-on" checked> <span>Motion and 3D</span></label>
          <label class="switch"><input type="checkbox" id="sound-on"> <span>Studio sounds</span></label>
          <label class="vol"><span class="mono">Volume</span><input type="range" id="sound-vol" min="0" max="100" value="60" aria-label="Sound volume"></label>
          <button type="button" class="pill small" id="sound-test">Play filing sound</button>
          <p class="fine">Placeholder sounds. Logo and final typefaces pending.</p>
        </div>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <dialog class="doc-dialog" id="doc-dialog" aria-labelledby="doc-title"></dialog>

  <script src="js/logic.js"></script>
  <script src="js/service.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
