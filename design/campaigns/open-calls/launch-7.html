<!doctype html>
<html><head><meta charset="utf-8"><title>Garden launch, 7 slides</title>
<style>
@font-face{font-family:HG;src:url(fonts/ath/HankenGrotesk.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:NR;src:url(fonts/ath/Newsreader-Italic.woff2) format("woff2");font-style:italic;font-weight:200 800}
@font-face{font-family:IS;src:url(fonts/InstrumentSerif-Italic.ttf) format("truetype");font-style:italic}
:root{--ink:#14090C;--paper:#F2F1EE;--pet:#025054;--pi:#D0D996;--cream:#F9ECE5;--burg:#6A0620}
body{margin:0;background:#C9D3CF;display:flex;flex-wrap:wrap;gap:40px;padding:40px}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:HG,sans-serif;-webkit-font-smoothing:antialiased}
.s *{margin:0;box-sizing:border-box}
.a{position:absolute}.c{text-align:center}
.img{background-size:cover;background-repeat:no-repeat}
/* one header system on every slide: four corner labels */
.cn{font-size:20px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.H{font-weight:600;letter-spacing:-.045em;line-height:1.02}
.R{font-weight:400;letter-spacing:-.04em;line-height:1.1}
.sub{font-size:32px;font-weight:500;line-height:1.38;letter-spacing:-.01em}
.it{font-family:IS,serif;font-style:italic;font-weight:400}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="ar" viewBox="0 0 46 20"><path d="M2 10h40M33 2l9 8-9 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>
<div id="out" style="display:contents"></div>
<script>
const corners = (col, dmCol, tr='Garden Edition') => `
  <p class="a cn" style="left:52px;top:48px;color:${col}">Arts to Hearts</p><p class="a cn" style="right:52px;top:48px;color:${col}">${tr}</p>
  <p class="a cn" style="left:52px;bottom:48px;color:${dmCol}">DM “GARDEN”</p><p class="a cn" style="right:52px;bottom:48px;color:${col}">Closes 13 Dec</p>`;

const EDS=[['Photography','#14090C','#F2F1EE',360],['Food','#AA0003','#FFD6DE',330],['Collage','#FAD2E1','#6A0620',370],['Landscape','#025054','#D0D996',345],['Abstract','#E3E8DE','#14090C',380],['Portrait','#6A0620','#FAD2E1',350],['Animal','#D0D996','#025054',335],['Floral','#FFD6DE','#AA0003',365],['Nature','#2E4A2A','#E3E8DE',375],['Dogs','#B7D9FF','#6A0620',340],['Pattern','#14090C','#D0D996',360],['Colors','#FFF3B2','#AA0003',350],['Faces','#4C4240','#F2F1EE',370],['Texture','#C9D3CF','#14090C',345],['Artist of the Year','#6A0620','#F2F1EE',380]];
const spineLab = (n,f,fs) => `<span style="position:absolute;left:50%;bottom:18px;transform:translateX(-50%) rotate(-90deg);white-space:nowrap;font-family:NR,serif;font-style:italic;font-size:${fs}px;width:0;color:${f}">${n}</span>`;

const S = [];

// 1 · COVER (chosen): hook
S.push(`<div class="s" style="color:#fff">
  <div class="a img" style="inset:0;background-image:url(art/flower-portrait.jpg);background-position:center 6%"></div>
  <div class="a" style="inset:0;background:linear-gradient(180deg,rgba(20,14,12,.38) 0%,rgba(20,14,12,0) 16%,rgba(20,14,12,0) 40%,rgba(20,14,12,.6) 62%,rgba(20,14,12,.8) 100%)"></div>
  ${corners('#fff','#fff','101 Art Book')}
  <div class="a" style="left:0;right:0;top:650px;display:flex;justify-content:center"><span class="cn" style="display:inline-flex;align-items:center;height:46px;padding:0 26px;background:var(--pi);color:var(--ink);border-radius:999px">Open call · Edition 16</span></div>
  <p class="a c" style="left:0;right:0;top:720px;font-size:136px;font-weight:700;letter-spacing:-.01em;line-height:.9;text-transform:uppercase">Call for<br>artists</p>
  <p class="a c it" style="left:0;right:0;top:975px;font-size:88px;line-height:1;color:var(--pi)">the Garden Edition</p>
  <p class="a c sub" style="left:150px;right:150px;top:1095px">101 places in a juried hardcover book.</p>
</div>`);

// 2 · THE SHELF: instant proof + belonging
S.push(`<div class="s" style="background:var(--paper);color:var(--ink)">
  ${corners('var(--ink)','var(--pet)')}
  <p class="a R c" style="left:80px;right:80px;top:220px;font-size:84px">15 editions. 1,300+ artists.<br>The <span style="color:var(--pet);font-weight:600">sixteenth</span> is open.</p>
  <div class="a" style="left:64px;right:64px;top:680px;height:420px;display:flex;align-items:flex-end;gap:8px;border-bottom:6px solid var(--ink);padding:0 10px">
   ${EDS.map(([n,b,f,h])=>`<div style="flex:1;height:${h}px;background:${b};border-radius:3px 3px 0 0;position:relative;box-shadow:inset -3px 0 0 rgba(0,0,0,.12)">${spineLab(n,f,22)}</div>`).join('')}
   <div style="flex:1.3;height:390px;border:3px dashed var(--pet);border-bottom:none;border-radius:3px 3px 0 0;position:relative;background:rgba(208,217,150,.35)">${spineLab('Garden','#025054',26)}</div>
  </div>
</div>`);

// 3 · THE THEME: emotion, art untouched
S.push(`<div class="s" style="color:#fff">
  <div class="a img" style="inset:0;background-image:url(art/night-bloom.jpg);background-position:center 44%"></div>
  <div class="a" style="inset:0;background:linear-gradient(180deg,rgba(20,9,12,.9) 0%,rgba(20,9,12,.55) 28%,rgba(20,9,12,0) 46%,rgba(20,9,12,0) 86%,rgba(20,9,12,.6) 100%)"></div>
  ${corners('#fff','#fff','The theme')}
  <p class="a c" style="left:100px;right:100px;top:170px;font-family:NR,serif;font-style:italic;font-size:80px;line-height:1.08;letter-spacing:-.015em">“A garden is more than a place where things grow.”</p>
</div>`);

// 4 · WHAT SELECTION BRINGS: value + believable reach, one visual
const BOOKS = [
  ['The book’s campaign','190K+ followers · 100K+ emails','#D0D996','#14090C',900,10],
  ['Sold in bookstores','Amazon · Barnes &amp; Noble','#6A0620','#FFFFFF',940,-8],
  ['Certificate of Recognition','For your CV and grants','#F2F1EE','#14090C',920,14],
  ['Your work in print','Hardcover collectible edition','#025054','#FFFFFF',952,0]];
S.push(`<div class="s" style="background:var(--ink);color:#fff">
  ${corners('#fff','var(--pi)','If selected')}
  <p class="a R c" style="left:80px;right:80px;top:260px;font-size:92px">What selection brings</p>
  <div class="a" style="left:64px;right:64px;top:520px;display:flex;flex-direction:column;gap:12px">
   ${BOOKS.map(([t,d,bg,fg,w,o])=>`<div style="width:${w}px;height:136px;margin-left:${(952-w)/2+o}px;background:${bg};color:${fg};border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 42px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.14)"><span style="font-size:42px;font-weight:600;letter-spacing:-.025em">${t}</span><span style="font-size:25px;font-weight:500;text-align:right">${d}</span></div>`).join('')}
  </div>
  <div class="a" style="left:64px;right:64px;top:1116px;border-top:6px solid var(--paper)"></div>
</div>`);

// 5 · WHO IT'S FOR: the one highlight pill in the carousel
S.push(`<div class="s" style="background:var(--paper);color:var(--ink)">
  ${corners('var(--ink)','var(--pet)','Who can apply')}
  <p class="a R c" style="left:80px;right:80px;top:330px;font-size:100px">Your work deserves the <span style="display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:0 .3em .07em;line-height:1">spotlight.</span></p>
  <p class="a c sub" style="left:150px;right:150px;top:720px;font-size:40px">Emerging, mid-career or established.</p>
  <p class="a c sub" style="left:170px;right:170px;top:830px;opacity:.65;font-size:30px">No degree, gallery or exhibition history needed. Open worldwide, 18+.</p>
</div>`);

// 6 · SELECTION: scarcity + aspiration
S.push(`<div class="s" style="background:var(--ink);color:#fff">
  ${corners('#fff','var(--pi)','Selection')}
  <p class="a R c" style="left:80px;right:80px;top:190px;font-size:88px">101 places,<br>chosen by the jury.</p>
  <div class="a" id="dots" style="left:64px;right:64px;top:440px;display:grid;grid-template-columns:repeat(17,1fr);gap:12px">
   ${Array.from({length:101},(_,i)=> i===100 ? '<div style="aspect-ratio:1;border-radius:50%;background:#D0D996;box-shadow:0 0 0 6px rgba(208,217,150,.25)"></div>' : '<div style="aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.35)"></div>').join('')}
   <p style="grid-column:12/18;font-family:IS,serif;font-style:italic;font-size:40px;color:#D0D996;align-self:center;padding-left:8px">&larr; yours?</p>
  </div>
  <p class="a c sub" style="left:120px;right:120px;top:960px">The winner receives <b style="color:var(--pi);font-weight:600">$500</b> and a 4-page feature.</p>
</div>`);

// 7 · ACTION: bookends slide 2
S.push(`<div class="s" style="background:var(--pet);color:#fff">
  ${corners('#fff','var(--pi)','Submissions open')}
  <p class="a H c" style="left:60px;right:60px;top:190px;font-size:108px">Take your place<br>on the shelf.</p>
  <div class="a" style="left:250px;right:250px;top:470px;height:300px;display:flex;align-items:flex-end;gap:10px;border-bottom:6px solid var(--paper);padding:0 14px">
   ${[['#AA0003',250],['#FAD2E1',280],['#F2F1EE',240],['#6A0620',270],['#D0D996',230],['#B7D9FF',260]].map(([c,h])=>`<div style="flex:1;height:${h}px;background:${c};border-radius:3px 3px 0 0"></div>`).join('')}
   <div style="flex:1.5;height:290px;background:var(--pi);border-radius:3px 3px 0 0;box-shadow:0 0 0 6px rgba(208,217,150,.3);position:relative">${spineLab('Garden','#14090C',30)}</div>
  </div>
  <div class="a" style="left:110px;right:110px;top:880px;height:124px;border-radius:999px;background:var(--pi);color:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 56px">
   <span style="font-size:44px;font-weight:700;letter-spacing:-.02em">DM “GARDEN” to apply</span>
   <span style="width:88px;height:88px;border-radius:50%;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center"><svg width="36" height="16"><use href="#ar"/></svg></span></div>
  <p class="a c" style="left:0;right:0;top:1050px;font-size:28px;opacity:.85">or apply via link in bio · application fee applicable</p>
</div>`);

const out = document.getElementById('out');
S.forEach((h,i)=>{ const d=document.createElement('div'); d.innerHTML=h; const el=d.firstElementChild; el.id='f'+(i+1); out.appendChild(el); });
</script>
</body></html>
