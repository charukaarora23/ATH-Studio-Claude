<!doctype html>
<html><head><meta charset="utf-8"><title>Garden launch, full</title>
<style>
@font-face{font-family:HG;src:url(fonts/ath/HankenGrotesk.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:NR;src:url(fonts/ath/Newsreader-Italic.woff2) format("woff2");font-style:italic;font-weight:200 800}
@font-face{font-family:IS;src:url(fonts/InstrumentSerif-Italic.ttf) format("truetype");font-style:italic}
:root{--ink:#14090C;--paper:#F9ECE5;--pet:#0E6B4A;--pi:#B8E2C8;--cream:#F9ECE5;--burg:#6A0620}
body{margin:0;background:#C9D3CF;display:flex;flex-wrap:wrap;gap:40px;padding:40px}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:HG,sans-serif;-webkit-font-smoothing:antialiased}
.s *{margin:0;box-sizing:border-box}
.a{position:absolute}.c{text-align:center}
.img{background-size:cover;background-repeat:no-repeat}
.cn{font-size:20px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.H{font-weight:600;letter-spacing:-.045em;line-height:1.02}
.R{font-weight:400;letter-spacing:-.04em;line-height:1.1}
.sub{font-size:32px;font-weight:500;line-height:1.38;letter-spacing:-.01em}
.it{font-family:IS,serif;font-style:italic;font-weight:400}
.lab{font-size:22px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
/* GAP = information still to be supplied. Visible on purpose; replace before posting. */
.gap{display:inline-block;border:2px dashed currentColor;border-radius:8px;padding:0 .3em;opacity:.75}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;border:3px dashed currentColor;border-radius:18px;opacity:.6;font-size:24px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1.5}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="ar" viewBox="0 0 46 20"><path d="M2 10h40M33 2l9 8-9 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>
<div id="out" style="display:contents"></div>
<script>
const corners = (col, dmCol, tr) => `
  <p class="a cn" style="left:52px;top:48px;color:${col}">Arts to Hearts</p><p class="a cn" style="right:52px;top:48px;color:${col}">${tr}</p>
  <p class="a cn" style="left:52px;bottom:48px;color:${dmCol}">DM “GARDEN”</p><p class="a cn" style="right:52px;bottom:48px;color:${col}">Closes 13 Dec</p>`;
const EDS=[['Photography','#14090C','#F2F1EE',360],['Food','#AA0003','#FFD6DE',330],['Collage','#FAD2E1','#6A0620',370],['Landscape','#0E6B4A','#B8E2C8',345],['Abstract','#E3E8DE','#14090C',380],['Portrait','#6A0620','#FAD2E1',350],['Animal','#B8E2C8','#0E6B4A',335],['Floral','#FFD6DE','#AA0003',365],['Nature','#2E4A2A','#E3E8DE',375],['Dogs','#B7D9FF','#6A0620',340],['Pattern','#14090C','#B8E2C8',360],['Colors','#FFF3B2','#AA0003',350],['Faces','#4C4240','#F2F1EE',370],['Texture','#C9D3CF','#14090C',345],['Artist of the Year','#6A0620','#F2F1EE',380]];
const spineLab = (n,f,fs) => `<span style="position:absolute;left:50%;bottom:18px;transform:translateX(-50%) rotate(-90deg);white-space:nowrap;font-family:NR,serif;font-style:italic;font-size:${fs}px;width:0;color:${f}">${n}</span>`;
const S = [];

// 1 · COVER (approved)
S.push(`<div class="s" style="color:#fff">
  <div class="a img" style="inset:0;background-image:url(art/flower-portrait.jpg);background-position:center 6%"></div>
  <div class="a" style="inset:0;background:linear-gradient(180deg,rgba(20,14,12,.38) 0%,rgba(20,14,12,0) 16%,rgba(20,14,12,0) 40%,rgba(20,14,12,.6) 62%,rgba(20,14,12,.82) 100%)"></div>
  ${corners('#fff','#fff','101 Art Book')}
  <div class="a" style="left:0;right:0;top:650px;display:flex;justify-content:center"><span class="cn" style="display:inline-flex;align-items:center;height:46px;padding:0 26px;background:var(--pi);color:var(--ink);border-radius:999px">Open call · Edition 16</span></div>
  <p class="a c" style="left:0;right:0;top:720px;font-size:136px;font-weight:700;letter-spacing:-.01em;line-height:.9;text-transform:uppercase">Call for<br>artists</p>
  <p class="a c it" style="left:0;right:0;top:975px;font-size:88px;line-height:1;color:var(--pi)">the Garden Edition</p>
  <p class="a c sub" style="left:150px;right:150px;top:1095px">Get published in a juried hardcover book of 101 artists.</p>
</div>`);

// 2 · WHO WE ARE
S.push(`<div class="s" style="background:var(--ink);color:#fff">
  ${corners('#fff','#FAD2E1','Who we are')}
  <p class="a lab" style="left:80px;top:180px;color:var(--pi)">Arts to Hearts Project</p>
  <div class="a" style="left:80px;right:80px;top:240px;display:grid;grid-template-columns:1fr 1fr;gap:40px">
    <div><p style="font-size:150px;font-weight:400;letter-spacing:-.06em;line-height:.9">35+</p><p class="sub" style="margin-top:14px;opacity:.85">curated art books published</p></div>
    <div><p style="font-size:150px;font-weight:400;letter-spacing:-.06em;line-height:.9">10K+</p><p class="sub" style="margin-top:14px;opacity:.85">artists featured worldwide</p></div>
  </div>
  <div class="a ph" style="left:80px;right:80px;top:560px;height:620px;color:#fff">Real photo needed<br>The books together</div>
</div>`);

// 3 · THE SERIES (approved shelf)
S.push(`<div class="s" style="background:var(--paper);color:var(--ink)">
  ${corners('var(--ink)','var(--burg)','The series')}
  <p class="a R c" style="left:80px;right:80px;top:200px;font-size:84px">15 editions. 1,300+ artists.<br>The <span style="color:var(--pet);font-weight:600">sixteenth</span> is open.</p>
  <div class="a" style="left:64px;right:64px;top:640px;height:420px;display:flex;align-items:flex-end;gap:8px;border-bottom:6px solid var(--ink);padding:0 10px">
   ${EDS.map(([n,b,f,h])=>`<div style="flex:1;height:${h}px;background:${b};border-radius:3px 3px 0 0;position:relative;box-shadow:inset -3px 0 0 rgba(0,0,0,.12)">${spineLab(n,f,22)}</div>`).join('')}
   <div style="flex:1.3;height:390px;border:3px dashed var(--pet);border-bottom:none;border-radius:3px 3px 0 0;position:relative;background:rgba(184,226,200,.35)">${spineLab('Garden','#0E6B4A',26)}</div>
  </div>
  <p class="a c sub" style="left:0;right:0;top:1110px;font-size:28px;opacity:.7">Publishing contemporary artists since 2023.</p>
</div>`);

// 4 · THE THEME + what you can submit
S.push(`<div class="s" style="color:#fff">
  <div class="a img" style="inset:0;background-image:url(art/night-bloom.jpg);background-position:center 44%"></div>
  <div class="a" style="inset:0;background:linear-gradient(180deg,rgba(20,9,12,.9) 0%,rgba(20,9,12,.5) 26%,rgba(20,9,12,0) 42%,rgba(20,9,12,0) 62%,rgba(20,9,12,.85) 80%,rgba(20,9,12,.95) 100%)"></div>
  ${corners('#fff','#FAD2E1','The theme')}
  <p class="a c" style="left:100px;right:100px;top:160px;font-family:NR,serif;font-style:italic;font-size:76px;line-height:1.08;letter-spacing:-.015em">“A garden is more than a place where things grow.”</p>
  <p class="a lab c" style="left:0;right:0;top:1000px;color:var(--pi)">What you can submit</p>
  <p class="a c sub" style="left:110px;right:110px;top:1044px;font-size:30px">Flowers, butterflies, trees, leaves, landscapes or imagined nature. Any medium. Original work only, no AI.</p>
</div>`);

// 5 · THE BOOK
S.push(`<div class="s" style="background:var(--paper);color:var(--ink)">
  ${corners('var(--ink)','var(--burg)','The book')}
  <div class="a ph" style="left:80px;right:80px;top:150px;height:640px;color:var(--ink)">Real photo needed<br>An open spread of a past edition</div>
  <p class="a R" style="left:80px;right:80px;top:850px;font-size:76px">A juried hardcover edition.</p>
  <p class="a sub" style="left:80px;right:140px;top:960px">Every selected artist is published with their name, artwork title, medium and country.</p>
</div>`);

// 6 · WHAT SELECTED ARTISTS RECEIVE (full list)
const BOOKS = [
  ['Copies for you','Available at a subsidised rate','#F9ECE5','#14090C',900,10],
  ['Introductions','To collectors, galleries and curators','#B8E2C8','#14090C',930,-8],
  ['Sold worldwide','Amazon · Barnes &amp; Noble · ATH Shop','#6A0620','#FFFFFF',944,6],
  ['The book’s campaign','190K+ followers · 100K+ email subscribers','#FAD2E1','#6A0620',910,-4],
  ['Certificate of Recognition','For your CV and grant applications','#F2F1EE','#14090C',926,12],
  ['Published in the book','Your work in print','#0E6B4A','#FFFFFF',952,0]];
S.push(`<div class="s" style="background:var(--ink);color:#fff">
  ${corners('#fff','#FAD2E1','If selected')}
  <p class="a R c" style="left:80px;right:80px;top:170px;font-size:84px">What selected artists receive</p>
  <div class="a" style="left:64px;right:64px;top:390px;display:flex;flex-direction:column;gap:10px">
   ${BOOKS.map(([t,d,bg,fg,w,o])=>`<div style="width:${w}px;height:106px;margin-left:${(952-w)/2+o}px;background:${bg};color:${fg};border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 38px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14)"><span style="font-size:38px;font-weight:600;letter-spacing:-.025em">${t}</span><span style="font-size:24px;font-weight:500;text-align:right">${d}</span></div>`).join('')}
  </div>
  <div class="a" style="left:64px;right:64px;top:1076px;border-top:6px solid var(--paper)"></div>
</div>`);

// 7 · RECOGNITION
S.push(`<div class="s" style="background:var(--paper);color:var(--ink)">
  ${corners('var(--ink)','var(--burg)','Recognition')}
  <p class="a R c" style="left:80px;right:80px;top:180px;font-size:80px">Three artists receive more.</p>
  <p class="a lab c" style="left:0;right:0;top:360px;color:var(--pet)">Winner</p>
  <p class="a c" style="left:0;right:0;top:410px;font-size:300px;font-weight:400;letter-spacing:-.07em;line-height:.85;color:var(--pet)">$500</p>
  <p class="a c sub" style="left:150px;right:150px;top:700px">plus a 4-page feature, a trophy and an Artsy listing.</p>
  <div class="a" style="left:120px;right:120px;top:850px;border-top:2px solid rgba(20,9,12,.18);padding-top:34px">
    <p class="lab c" style="color:var(--pet)">Two runners-up</p>
    <p class="c sub" style="margin-top:10px">A 2-page feature and a trophy.</p></div>
  <p class="a c" style="left:0;right:0;top:1120px;font-size:22px"><span class="gap">Confirm Garden prizes match Artist of the Year</span></p>
</div>`);

// 8 · SELECTION + TIMELINE
S.push(`<div class="s" style="background:var(--ink);color:#fff">
  ${corners('#fff','#FAD2E1','Selection')}
  <p class="a R c" style="left:80px;right:80px;top:170px;font-size:80px">101 places, chosen by<br><span class="gap" style="font-size:64px">the jury</span></p>
  <div class="a" style="left:120px;right:120px;top:410px;display:grid;grid-template-columns:repeat(17,1fr);gap:10px">
   ${Array.from({length:101},(_,i)=> i===100 ? '<div style="aspect-ratio:1;border-radius:50%;background:#B8E2C8;box-shadow:0 0 0 5px rgba(184,226,200,.25)"></div>' : '<div style="aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.35)"></div>').join('')}
   <p style="grid-column:12/18;font-family:IS,serif;font-style:italic;font-size:34px;color:#B8E2C8;align-self:center;padding-left:6px">&larr; yours?</p>
  </div>
  <div class="a" style="left:80px;right:80px;top:820px;display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid rgba(255,255,255,.2);padding-top:30px">
    <div><p class="lab" style="color:var(--pi)">13 Dec</p><p class="sub" style="font-size:28px;margin-top:8px">Submissions close</p></div>
    <div style="border-left:2px solid rgba(255,255,255,.16);padding-left:30px"><p class="lab"><span class="gap">Date</span></p><p class="sub" style="font-size:28px;margin-top:8px">Results announced</p></div>
    <div style="border-left:2px solid rgba(255,255,255,.16);padding-left:30px"><p class="lab"><span class="gap">Month</span></p><p class="sub" style="font-size:28px;margin-top:8px">Book published</p></div>
  </div>
  <p class="a c sub" style="left:0;right:0;top:1080px;font-size:26px;opacity:.75">Application fee: <span class="gap">amount, or “applicable”</span></p>
</div>`);

// 9 · WHO CAN APPLY (approved spotlight)
S.push(`<div class="s" style="background:var(--paper);color:var(--ink)">
  ${corners('var(--ink)','var(--burg)','Who can apply')}
  <p class="a R c" style="left:80px;right:80px;top:330px;font-size:100px">Your work deserves the <span style="display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:0 .3em .07em;line-height:1">spotlight.</span></p>
  <p class="a c sub" style="left:150px;right:150px;top:720px;font-size:40px">Emerging, mid-career or established.</p>
  <p class="a c sub" style="left:170px;right:170px;top:830px;opacity:.65;font-size:30px">No degree, gallery or exhibition history needed. Individual artists, 18+, worldwide.</p>
</div>`);

// 10 · PROOF: past artists
const card = () => `<div style="background:rgba(255,255,255,.06);border-radius:24px;padding:28px">
  <div class="ph" style="height:400px;color:#fff">Their page<br>in the book</div>
  <p style="font-size:30px;font-weight:600;margin-top:24px"><span class="gap">Artist name</span></p>
  <p style="font-size:24px;opacity:.7;margin-top:10px"><span class="gap">Edition · Country</span></p>
  <p style="font-family:NR,serif;font-style:italic;font-size:30px;line-height:1.3;margin-top:20px;opacity:.9">“<span class="gap">One real line</span>”</p></div>`;
S.push(`<div class="s" style="background:var(--ink);color:#fff">
  ${corners('#fff','#FAD2E1','From past editions')}
  <p class="a R c" style="left:80px;right:80px;top:170px;font-size:80px">Published artists</p>
  <div class="a" style="left:64px;right:64px;top:330px;display:grid;grid-template-columns:1fr 1fr;gap:24px">${card()}${card()}</div>
</div>`);

// 11 · ACTION (approved)
S.push(`<div class="s" style="background:var(--pet);color:#fff">
  ${corners('#fff','#FAD2E1','Submissions open')}
  <p class="a H c" style="left:60px;right:60px;top:180px;font-size:108px">Take your place<br>on the shelf.</p>
  <div class="a" style="left:250px;right:250px;top:450px;height:300px;display:flex;align-items:flex-end;gap:10px;border-bottom:6px solid var(--paper);padding:0 14px">
   ${[['#FAD2E1',250],['#F9ECE5',280],['#6A0620',240],['#14090C',270],['#FAD2E1',230],['#F9ECE5',260]].map(([c,h])=>`<div style="flex:1;height:${h}px;background:${c};border-radius:3px 3px 0 0"></div>`).join('')}
   <div style="flex:1.5;height:290px;background:var(--pi);border-radius:3px 3px 0 0;box-shadow:0 0 0 6px rgba(184,226,200,.3);position:relative">${spineLab('Garden','#14090C',30)}</div>
  </div>
  <div class="a" style="left:110px;right:110px;top:850px;height:124px;border-radius:999px;background:var(--cream);color:var(--burg);display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 56px">
   <span style="font-size:44px;font-weight:700;letter-spacing:-.02em">DM “GARDEN” to apply</span>
   <span style="width:88px;height:88px;border-radius:50%;background:var(--burg);color:var(--cream);display:inline-flex;align-items:center;justify-content:center"><svg width="36" height="16"><use href="#ar"/></svg></span></div>
  <p class="a c" style="left:0;right:0;top:1020px;font-size:28px;opacity:.9">or apply via link in bio</p>
  <p class="a c" style="left:0;right:0;top:1070px;font-size:26px;opacity:.7">artstoheartsproject.com</p>
</div>`);

const out = document.getElementById('out');
S.forEach((h,i)=>{ const d=document.createElement('div'); d.innerHTML=h; const el=d.firstElementChild; el.id='z'+(i+1); out.appendChild(el); });
</script>
</body></html>
